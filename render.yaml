# Render Blueprint: one Docker web service (API + UI) and a managed PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: sentinelai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelai-db
          property: connectionString
      - key: AI_PROVIDER
        value: offline
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANALYST_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false

databases:
  - name: sentinelai-db
    plan: free
    databaseName: sentinel
    user: sentinel
